name: ANG.TV - Validar y mantener catálogo

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validar catálogo sin modificarlo
        run: python scripts/validar_catalogo.py
